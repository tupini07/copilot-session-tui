[package]
name = "copilot-session-tui"
version = "0.38.0"
edition = "2021"
rust-version = "1.86"
description = "A TUI for managing GitHub Copilot CLI sessions"

# Off by default: the generator exists only to regenerate the README images from the
# real widgets, and shipped builds have no use for it.
[features]
screenshots = []

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
# preserve_order: a question form's fields must arrive in the order Copilot shows them,
# not sorted by key. Without it serde_json's object is a BTreeMap and `properties`
# {size, note} becomes {note, size}, so a reply's lines land on the wrong fields.
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
fuzzy-matcher = "0.3"
self_update = { version = "0.42", default-features = false, features = ["archive-tar", "archive-zip", "compression-flate2", "compression-zip-deflate"] }
semver = "1"
ureq = { version = "3", features = ["json"] }
ignore = "0.4"
# Session names contain emoji; measuring and cutting them safely needs real Unicode
# width and grapheme support. Both already ship as ratatui dependencies.
unicode-width = "0.2"
unicode-segmentation = "1"
sha2 = "0.10"
tempfile = "3"
fs4 = "1"
uuid = { version = "1", features = ["v4"] }
# Vendored to keep visual wrapping, cursor placement, and mouse hit-testing on the
# same word-boundary algorithm. Upstream 0.11.6 supports character wrapping only.
edtui = { path = "vendor/edtui", version = "0.11.6", default-features = false, features = ["mouse-support", "syntax-highlighting"] }
arboard = { version = "3.6.1", default-features = false }
portable-pty = "0.9"
vt100 = "0.16"
# The parser vt100 is built on, run alongside it: vt100 never says which bytes printed a
# character, and a hyperlink is exactly the characters printed while it is open.
vte = "0.15"
tui-term = "0.3"
# GitHub bodies are markdown. Syntax highlighting is left off: its themes are its own and
# would clash with the CST theme the diff view already highlights with.
tui-markdown = { version = "0.3", default-features = false }
# Already pulled in by tui-markdown; named directly to find HTML comments to drop.
pulldown-cmark = { version = "0.13", default-features = false }
# A screen or a table as a picture for Telegram: glyph outlines, the font bytes (Hack and
# Noto Emoji, which this crate exists to ship), and a PNG encoder. Drawn in-process
# because CST may be running over SSH with no browser or desktop to ask.
ab_glyph = "0.2"
epaint_default_fonts = "0.34"
png = "0.18"

[target.'cfg(windows)'.dependencies]
# Checking whether a PID is alive by shelling out to tasklist costs ~250 ms per call,
# which dominated startup. OpenProcess answers the same question in microseconds.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    # Opening an HTML link in the browser: Explorer cannot take a path with a comma.
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
