name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release
        required: true
        type: string

permissions:
  contents: write

jobs:
  # Deliberately has no `needs:`, so a missing changelog section fails in seconds
  # rather than after the whole build matrix.
  notes:
    name: Validate release notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Check CHANGELOG.md has a section for this version
        run: sh .github/scripts/changelog-section.sh "${{ inputs.tag || github.ref_name }}" > /dev/null

  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: copilot-session-tui.exe
            archive: copilot-session-tui-x86_64-pc-windows-msvc.zip
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: copilot-session-tui
            archive: copilot-session-tui-x86_64-unknown-linux-gnu.tar.gz

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # NoCompression (stored entries) so that binaries <= v0.6.0, which were built
          # without the self_update `compression-zip-deflate` feature, can still extract
          # this archive and update themselves to a fixed version.
          Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.artifact }}" -DestinationPath "${{ matrix.archive }}" -CompressionLevel NoCompression

      - name: Package (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          tar czf ${{ matrix.archive }} -C target/${{ matrix.target }}/release ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  release:
    name: Create Release
    needs: [build, notes]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          # Tags are needed to work out which release this one follows, for the
          # compare link; the default shallow checkout has none.
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate checksums
        shell: bash
        run: |
          while IFS= read -r file; do
            hash="$(sha256sum "$file" | cut -d ' ' -f 1)"
            printf '%s  %s\n' "$hash" "$(basename "$file")"
          done < <(find artifacts -type f | sort) > SHA256SUMS

      # Re-run the extractor here rather than passing the body between jobs: a
      # multiline value through $GITHUB_OUTPUT needs heredoc delimiters that corrupt
      # silently if any line happens to match them.
      - name: Build release body
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          sh .github/scripts/changelog-section.sh "$TAG" > RELEASE_NOTES.md
          previous="$(git tag --sort=-v:refname | grep -v "^${TAG}$" | head -1)"
          if [ -n "$previous" ]; then
            printf '\nFull changelog: %s/%s/compare/%s...%s\n' \
              "${{ github.server_url }}" "${{ github.repository }}" "$previous" "$TAG" \
              >> RELEASE_NOTES.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            artifacts/**/*
            SHA256SUMS
